<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO OPTIMIZATION & META TAGS -->
  <title>DataFlow SaaS — Free Pro JSON to CSV Converter & JSON Formatter</title>
  <meta name="description" content="Free online tool to convert nested JSON to CSV, format, validate, and minify JSON instantly. Fast, secure, and built for developers and data analysts." />
  <meta name="keywords" content="json to csv converter, nested json converter, json formatter, json validator, online developer tools, free micro saas" />
  <meta name="author" content="DataFlow SaaS" />
  
  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="DataFlow SaaS — Developer Utilities Suite" />
  <meta property="og:description" content="Convert complex nested JSON to CSV and format JSON files instantly in your browser." />
  <meta property="og:type" content="website" />

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Navbar */
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1rem 2rem; background: var(--card); border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
    .logo span { color: var(--text); }
    .nav-actions { display: flex; gap: 1rem; align-items: center; }
    
    button {
      padding: 0.6rem 1.2rem; border: none; border-radius: 6px; font-weight: 600;
      cursor: pointer; transition: 0.2s; font-size: 0.9rem;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--border); }
    .btn-success { background: var(--success); color: white; }
    
    /* Main Container */
    .container { max-width: 1100px; width: 100%; margin: 2rem auto; padding: 0 1rem; flex: 1; }
    .header { text-align: center; margin-bottom: 1.5rem; }
    .header h1 { font-size: 2rem; margin-bottom: 0.4rem; }
    .header p { color: var(--muted); }

    /* Tool Switcher Tabs */
    .tool-tabs {
      display: flex; justify-content: center; gap: 1rem; margin-bottom: 1.5rem;
    }
    .tab-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      padding: 0.6rem 1.5rem; border-radius: 30px; font-weight: 600; cursor: pointer;
    }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Toolbar */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.8rem; justify-content: space-between;
      background: var(--card); padding: 1rem; border-radius: 8px; border: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .tool-group { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }

    /* Editor Grid */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    
    .box { display: flex; flex-direction: column; }
    .box label { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 600; }
    textarea {
      width: 100%; height: 340px; background: var(--card); color: #e2e8f0;
      border: 1px solid var(--border); border-radius: 8px; padding: 1rem;
      font-family: 'Consolas', monospace; font-size: 0.9rem; resize: vertical;
    }
    textarea:focus { outline: 2px solid var(--primary); }

    /* Auth Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      justify-content: center; align-items: center; z-index: 100; padding: 1rem;
    }
    .modal {
      background: var(--card); padding: 2rem; border-radius: 12px; width: 100%;
      max-width: 410px; border: 1px solid var(--border);
    }
    .modal h2 { margin-bottom: 0.4rem; }
    .modal p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.4rem; }
    .input-group { margin-bottom: 1rem; }
    .input-group label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--muted); }
    .input-group input {
      width: 100%; padding: 0.7rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.95rem;
    }
    .input-group input:focus { outline: 1px solid var(--primary); }

    .forgot-link {
      display: inline-flex; align-items: center; gap: 0.35rem;
      color: #60a5fa; font-size: 0.85rem; cursor: pointer;
      margin-top: 0.4rem; text-decoration: none; font-weight: 500;
    }
    .forgot-link:hover { text-decoration: underline; color: #93c5fd; }
    .q-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%;
      background: rgba(96, 165, 250, 0.2); border: 1px solid #60a5fa;
      font-size: 0.7rem; font-weight: bold;
    }

    .auth-msg { font-size: 0.85rem; margin-top: 0.8rem; text-align: center; min-height: 1.2rem; }
    .badge {
      background: rgba(59, 130, 246, 0.2); color: #60a5fa; padding: 0.3rem 0.7rem;
      border-radius: 20px; font-size: 0.8rem; font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">DataFlow<span>SaaS</span></div>
    <div class="nav-actions" id="nav-logged-out">
      <button class="btn-outline" onclick="openModal('login')">Log In</button>
      <button class="btn-primary" onclick="openModal('signup')">Sign Up Free</button>
    </div>
    <div class="nav-actions" id="nav-logged-in" style="display: none;">
      <span class="badge" id="user-email-display">user@email.com</span>
      <button class="btn-outline" onclick="handleLogout()">Logout</button>
    </div>
  </nav>

  <!-- Main Workspace -->
  <div class="container">
    <div class="header">
      <h1 id="mainTitle">Nested JSON to CSV Converter</h1>
      <p id="mainSubtitle">Automatically flattens deep JSON objects into clean spreadsheet-ready CSV.</p>
    </div>

    <!-- Tool Switcher Tabs -->
    <div class="tool-tabs">
      <button class="tab-btn active" id="tabCsv" onclick="switchTool('csv')">📊 JSON to CSV</button>
      <button class="tab-btn" id="tabFormat" onclick="switchTool('format')">🧹 JSON Formatter & Validator</button>
    </div>

    <!-- TOOL 1: JSON TO CSV -->
    <div id="toolCsvSection">
      <div class="toolbar">
        <div class="tool-group">
          <input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleFileUpload(event)" />
          <button class="btn-outline" onclick="document.getElementById('fileInput').click()">📁 Upload .JSON</button>
          <button class="btn-outline" onclick="loadSampleCsv()">✨ Load Sample</button>
          <button class="btn-outline" onclick="clearAllCsv()">🗑️ Clear</button>
        </div>
        <div class="tool-group">
          <button class="btn-primary" onclick="convertJsonToCsv()">⚡ Convert to CSV</button>
          <button class="btn-outline" onclick="copyCsv()">📋 Copy CSV</button>
          <button class="btn-success" onclick="downloadCsv()">⬇️ Download CSV</button>
        </div>
      </div>

      <div class="grid">
        <div class="box">
          <label>INPUT JSON</label>
          <textarea id="jsonInput" placeholder='Paste your JSON array or object here...'></textarea>
        </div>
        <div class="box">
          <label>OUTPUT CSV (FLATTENED)</label>
          <textarea id="csvOutput" readonly placeholder='Your converted CSV will appear here...'></textarea>
        </div>
      </div>
    </div>

    <!-- TOOL 2: JSON FORMATTER & VALIDATOR -->
    <div id="toolFormatSection" style="display: none;">
      <div class="toolbar">
        <div class="tool-group">
          <button class="btn-outline" onclick="loadSampleFormat()">✨ Load Sample</button>
          <button class="btn-outline" onclick="clearAllFormat()">🗑️ Clear</button>
        </div>
        <div class="tool-group">
          <button class="btn-primary" onclick="formatJson()">✨ Format / Beautify</button>
          <button class="btn-outline" onclick="minifyJson()">📦 Minify</button>
          <button class="btn-outline" onclick="copyFormatted()">📋 Copy Result</button>
        </div>
      </div>

      <div class="grid">
        <div class="box">
          <label>RAW JSON INPUT</label>
          <textarea id="formatInput" placeholder='Paste messy or unformatted JSON here...'></textarea>
        </div>
        <div class="box">
          <label>FORMATTED / VALIDATED OUTPUT</label>
          <textarea id="formatOutput" readonly placeholder='Clean formatted JSON or validation results...'></textarea>
        </div>
      </div>
    </div>

  </div>

  <!-- Auth & Verification Portal Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <h2 id="modalTitle">Create Account</h2>
      <p id="modalSubtitle">Sign up to unlock unlimited nested conversions.</p>

      <div id="standardAuthView">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="authEmail" placeholder="you@example.com" />
        </div>
        <div class="input-group">
          <label>Password (min 6 characters)</label>
          <input type="password" id="authPassword" placeholder="••••••••" />
          <div style="text-align: right;">
            <span class="forgot-link" onclick="switchToForgotPortal()">
              <span class="q-icon">?</span> Forgot password?
            </span>
          </div>
        </div>
        <button class="btn-primary" style="width: 100%;" id="authSubmitBtn" onclick="handleAuth()">Sign Up</button>
      </div>

      <div id="forgotPortalView" style="display: none;">
        <div id="stepSendCode">
          <div class="input-group">
            <label>Enter Your Email Address</label>
            <input type="email" id="recoveryEmail" placeholder="you@example.com" />
          </div>
          <button class="btn-primary" style="width: 100%;" onclick="sendVerificationCode()">📩 Send Verification Code</button>
        </div>

        <div id="stepVerifyCode" style="display: none;">
          <div class="input-group">
            <label>6-Digit Verification Code (Check Email)</label>
            <input type="text" id="otpCodeInput" placeholder="123456" maxlength="6" style="letter-spacing: 3px; font-weight: bold; text-align: center;" />
          </div>
          <div class="input-group">
            <label>Set New Password (min 6 characters)</label>
            <input type="password" id="newPasswordInput" placeholder="••••••••" />
          </div>
          <button class="btn-success" style="width: 100%;" onclick="confirmCodeAndAccount()">✅ Confirm & Access Account</button>
        </div>
      </div>

      <button class="btn-outline" style="width: 100%; margin-top: 0.6rem;" onclick="closeModal()">Cancel</button>
      <div class="auth-msg" id="authMessage"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wbpwvnjfwjlaangnqcbm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_j44_LPj3_3Bc3-7lUYDvjw_L4-Bcynj';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let authMode = 'signup';

    async function checkUser() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      updateNavbar(user);
    }
    checkUser();

    function updateNavbar(user) {
      if (user) {
        document.getElementById('nav-logged-out').style.display = 'none';
        document.getElementById('nav-logged-in').style.display = 'flex';
        document.getElementById('user-email-display').textContent = user.email;
      } else {
        document.getElementById('nav-logged-out').style.display = 'flex';
        document.getElementById('nav-logged-in').style.display = 'none';
      }
    }

    function openModal(mode) {
      authMode = mode;
      document.getElementById('authModal').style.display = 'flex';
      document.getElementById('authMessage').textContent = '';
      document.getElementById('standardAuthView').style.display = 'block';
      document.getElementById('forgotPortalView').style.display = 'none';

      if (mode === 'signup') {
        document.getElementById('modalTitle').textContent = 'Create Free Account';
        document.getElementById('modalSubtitle').textContent = 'Join DataFlow SaaS to save and export data.';
        document.getElementById('authSubmitBtn').textContent = 'Sign Up';
      } else {
        document.getElementById('modalTitle').textContent = 'Welcome Back';
        document.getElementById('modalSubtitle').textContent = 'Log in to your DataFlow SaaS account.';
        document.getElementById('authSubmitBtn').textContent = 'Log In';
      }
    }

    function closeModal() {
      document.getElementById('authModal').style.display = 'none';
    }

    function switchToForgotPortal() {
      document.getElementById('standardAuthView').style.display = 'none';
      document.getElementById('forgotPortalView').style.display = 'block';
      document.getElementById('stepSendCode').style.display = 'block';
      document.getElementById('stepVerifyCode').style.display = 'none';
      document.getElementById('authMessage').textContent = '';

      document.getElementById('modalTitle').textContent = 'Email Verification Portal';
      document.getElementById('modalSubtitle').textContent = 'Enter your email to receive a random verification code.';
      
      const typedEmail = document.getElementById('authEmail').value.trim();
      if (typedEmail) document.getElementById('recoveryEmail').value = typedEmail;
    }

    async function sendVerificationCode() {
      const email = document.getElementById('recoveryEmail').value.trim();
      const msgEl = document.getElementById('authMessage');

      if (!email) {
        msgEl.style.color = '#f87171';
        msgEl.textContent = 'Please enter your email address first.';
        return;
      }

      msgEl.style.color = '#94a3b8';
      msgEl.textContent = 'Sending verification code to your email...';

      const { error } = await supabaseClient.auth.signInWithOtp({
        email: email,
        options: { shouldCreateUser: true }
      });

      if (error) {
        msgEl.style.color = '#f87171';
        msgEl.textContent = error.message;
      } else {
        msgEl.style.color = '#34d399';
        msgEl.textContent = 'Code sent! Check your email inbox (or spam folder).';
        document.getElementById('stepSendCode').style.display = 'none';
        document.getElementById('stepVerifyCode').style.display = 'block';
        document.getElementById('modalSubtitle').textContent = `Enter the code sent to ${email} and set your password.`;
      }
    }

    async function confirmCodeAndAccount() {
      const email = document.getElementById('recoveryEmail').value.trim();
      const token = document.getElementById('otpCodeInput').value.trim();
      const newPassword = document.getElementById('newPasswordInput').value.trim();
      const msgEl = document.getElementById('authMessage');

      if (!token || token.length < 6) {
        msgEl.style.color = '#f87171';
        msgEl.textContent = 'Please enter the 6-digit code from your email.';
        return;
      }
      if (!newPassword || newPassword.length < 6) {
        msgEl.style.color = '#f87171';
        msgEl.textContent = 'Please enter a password (at least 6 characters).';
        return;
      }

      msgEl.style.color = '#94a3b8';
      msgEl.textContent = 'Verifying code and confirming account...';

      const { data, error } = await supabaseClient.auth.verifyOtp({
        email: email,
        token: token,
        type: 'email'
      });

      if (error) {
        msgEl.style.color = '#f87171';
        msgEl.textContent = 'Invalid or expired code: ' + error.message;
        return;
      }

      await supabaseClient.auth.updateUser({ password: newPassword });

      msgEl.style.color = '#34d399';
      msgEl.textContent = 'Account verified & confirmed! Logging you in...';
      updateNavbar(data.user);
      setTimeout(closeModal, 1000);
    }

    async function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const msgEl = document.getElementById('authMessage');

      if (!email || !password) {
        msgEl.style.color = '#f87171';
        msgEl.textContent = 'Please enter both email and password.';
        return;
      }

      msgEl.style.color = '#94a3b8';
      msgEl.textContent = 'Processing...';

      let result;
      if (authMode === 'signup') {
        result = await supabaseClient.auth.signUp({ email, password });
      } else {
        result = await supabaseClient.auth.signInWithPassword({ email, password });
      }

      if (result.error) {
        msgEl.style.color = '#f87171';
        msgEl.textContent = result.error.message;
      } else {
        msgEl.style.color = '#34d399';
        msgEl.textContent = authMode === 'signup' ? 'Account created!' : 'Logged in!';
        updateNavbar(result.data.user);
        setTimeout(closeModal, 800);
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      updateNavbar(null);
    }

    function switchTool(tool) {
      if (tool === 'csv') {
        document.getElementById('tabCsv').classList.add('active');
        document.getElementById('tabFormat').classList.remove('active');
        document.getElementById('toolCsvSection').style.display = 'block';
        document.getElementById('toolFormatSection').style.display = 'none';
        document.getElementById('mainTitle').textContent = 'Nested JSON to CSV Converter';
        document.getElementById('mainSubtitle').textContent = 'Automatically flattens deep JSON objects into clean spreadsheet-ready CSV.';
      } else {
        document.getElementById('tabFormat').classList.add('active');
        document.getElementById('tabCsv').classList.remove('active');
        document.getElementById('toolCsvSection').style.display = 'none';
        document.getElementById('toolFormatSection').style.display = 'block';
        document.getElementById('mainTitle').textContent = 'JSON Formatter & Validator';
        document.getElementById('mainSubtitle').textContent = 'Beautify, validate, and minify your JSON data instantly.';
      }
    }

    function flattenObject(obj, prefix = '', res = {}) {
      for (let key in obj) {
        if (!obj.hasOwnProperty(key)) continue;
        const propName = prefix ? `${prefix}.${key}` : key;
        if (typeof obj[key] === 'object' && obj[key] !== null && !Array.isArray(obj[key])) {
          flattenObject(obj[key], propName, res);
        } else if (Array.isArray(obj[key])) {
          res[propName] = JSON.stringify(obj[key]);
        } else {
          res[propName] = obj[key];
        }
      }
      return res;
    }

    function convertJsonToCsv() {
      const raw = document.getElementById('jsonInput').value.trim();
      if (!raw) return alert('Please paste JSON data first!');
      try {
        let parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) parsed = [parsed];
        const flattenedRows = parsed.map(item => flattenObject(item));
        const headers = [...new Set(flattenedRows.flatMap(row => Object.keys(row)))];
        const csvLines = [headers.join(',')];
        for (const row of flattenedRows) {
          const values = headers.map(header => {
            const val = row[header] === undefined || row[header] === null ? '' : String(row[header]);
            return `"${val.replace(/"/g, '""')}"`;
          });
          csvLines.push(values.join(','));
        }
        document.getElementById('csvOutput').value = csvLines.join('\n');
      } catch (err) {
        alert('Invalid JSON format: ' + err.message);
      }
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('jsonInput').value = e.target.result;
        convertJsonToCsv();
      };
      reader.readAsText(file);
    }

    function copyCsv() {
      const csv = document.getElementById('csvOutput').value;
      if (!csv) return alert('Nothing to copy!');
      navigator.clipboard.writeText(csv);
      alert('CSV copied to clipboard!');
    }

    function downloadCsv() {
      const csv = document.getElementById('csvOutput').value;
      if (!csv) return alert('Convert JSON to CSV first!');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dataflow_export.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function loadSampleCsv() {
      const sample = [
        { id: 101, user: { name: "Ali Khan", contact: { city: "Lahore", phone: "0300-1234567" } }, plan: "Pro" },
        { id: 102, user: { name: "Sara Ahmed", contact: { city: "Karachi", phone: "0321-7654321" } }, plan: "Free" }
      ];
      document.getElementById('jsonInput').value = JSON.stringify(sample, null, 2);
      convertJsonToCsv();
    }

    function clearAllCsv() {
      document.getElementById('jsonInput').value = '';
      document.getElementById('csvOutput').value = '';
    }

    function formatJson() {
      const raw = document.getElementById('formatInput').value.trim();
      if (!raw) return alert('Please enter JSON to format!');
      try {
        const parsed = JSON.parse(raw);
        document.getElementById('formatOutput').value = JSON.stringify(parsed, null, 2);
      } catch (err) {
        document.getElementById('formatOutput').value = '❌ INVALID JSON ERROR:\n' + err.message;
      }
    }

    function minifyJson() {
      const raw = document.getElementById('formatInput').value.trim();
      if (!raw) return alert('Please enter JSON to minify!');
      try {
        const parsed = JSON.parse(raw);
        document.getElementById('formatOutput').value = JSON.stringify(parsed);
      } catch (err) {
        document.getElementById('formatOutput').value = '❌ INVALID JSON ERROR:\n' + err.message;
      }
    }

    function copyFormatted() {
      const text = document.getElementById('formatOutput').value;
      if (!text) return alert('Nothing to copy!');
      navigator.clipboard.writeText(text);
      alert('Result copied to clipboard!');
    }

    function loadSampleFormat() {
      const sample = {"name":"Azan","role":"Developer","skills":["Python","JavaScript","SQL"],"active":true};
      document.getElementById('formatInput').value = JSON.stringify(sample);
      formatJson();
    }

    function clearAllFormat() {
      document.getElementById('formatInput').value = '';
      document.getElementById('formatOutput').value = '';
    }
  </script>
</body>
</html>
